---
- name: Create dashboard directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ monitoring_base_path }}/dashboard"
    - "{{ monitoring_graphs_path }}"

- name: Find all dashboard.yml files
  ansible.builtin.find:
    paths: "{{ services_path }}"
    patterns: "dashboard.yml"
    recurse: true
    contains: ".*"
    file_type: file
  delegate_to: localhost
  become: false
  register: dashboard_files_found

- name: Read dashboard fragments
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ dashboard_files_found.files }}"
  loop_control:
    label: "{{ item.path | regex_replace('.*/services/([^/]+)/.*', '\\1') }}"
  delegate_to: localhost
  become: false
  register: dashboard_slurped

- name: Build dashboard service configs
  ansible.builtin.set_fact:
    dashboard_service_configs: "{{ dashboard_service_configs | default([]) + [{'service': service, 'title': config.title, 'rrd_file': service + '.rrd', 'graphs': config.graphs}] }}"
  loop: "{{ dashboard_slurped.results }}"
  loop_control:
    label: "{{ item.source | regex_replace('.*/services/([^/]+)/.*', '\\1') }}"
  vars:
    config: "{{ item.content | b64decode | from_yaml }}"
    service: "{{ item.source | regex_replace('.*/services/([^/]+)/.*', '\\1') }}"
  when: dashboard_slurped.results | length > 0

- name: Set empty dashboard configs if no fragments found
  ansible.builtin.set_fact:
    dashboard_service_configs: []
  when: dashboard_slurped.results | length == 0

- name: Template dashboard generation script
  ansible.builtin.template:
    src: generate-dashboard.sh.j2
    dest: "{{ monitoring_base_path }}/dashboard/generate.sh"
    owner: root
    group: root
    mode: "0755"

- name: Template dashboard systemd service
  ansible.builtin.template:
    src: dashboard.service.j2
    dest: /etc/systemd/system/monitoring-dashboard.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Template dashboard systemd timer
  ansible.builtin.template:
    src: dashboard.timer.j2
    dest: /etc/systemd/system/monitoring-dashboard.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start dashboard timer
  ansible.builtin.systemd:
    name: monitoring-dashboard.timer
    enabled: true
    state: started
    daemon_reload: true
