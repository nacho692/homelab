---
- name: "homeassistant - Enable packages in configuration.yaml"
  ansible.builtin.blockinfile:
    path: "{{ services_base_path }}/homeassistant/config/configuration.yaml"
    marker: "# {mark} ANSIBLE MANAGED - packages"
    block: |
      homeassistant:
        packages: !include_dir_named packages
  tags:
    - services

- name: "homeassistant - Ensure custom_components directory exists"
  ansible.builtin.file:
    path: "{{ services_base_path }}/homeassistant/config/custom_components"
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - services

- name: "homeassistant - Download Remote Home Assistant integration"
  ansible.builtin.get_url:
    url: "https://github.com/custom-components/remote_homeassistant/archive/refs/tags/{{ remote_hass_integration_version }}.tar.gz"
    dest: "/tmp/remote-homeassistant-integration.tar.gz"
    mode: "0644"
  tags:
    - services

- name: "homeassistant - Install Remote Home Assistant integration"
  ansible.builtin.unarchive:
    src: "/tmp/remote-homeassistant-integration.tar.gz"
    dest: "{{ services_base_path }}/homeassistant/config/custom_components"
    remote_src: true
    include:
      - "*/custom_components/remote_homeassistant/*"
    extra_opts:
      - "--strip-components=2"
      - "--wildcards"
    owner: root
    group: root
    mode: "0755"
  tags:
    - services

- name: "homeassistant - Download Frigate integration"
  ansible.builtin.get_url:
    url: "https://github.com/blakeblackshear/frigate-hass-integration/archive/refs/tags/{{ frigate_hass_integration_version }}.tar.gz"
    dest: "/tmp/frigate-hass-integration.tar.gz"
    mode: "0644"
  tags:
    - services

- name: "homeassistant - Install Frigate integration"
  ansible.builtin.unarchive:
    src: "/tmp/frigate-hass-integration.tar.gz"
    dest: "{{ services_base_path }}/homeassistant/config/custom_components"
    remote_src: true
    include:
      - "*/custom_components/frigate/*"
    extra_opts:
      - "--strip-components=2"
      - "--wildcards"
    owner: root
    group: root
    mode: "0755"
  tags:
    - services
