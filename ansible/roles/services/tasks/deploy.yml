---
- name: "{{ service_name }} - Check for pre-deploy hook"
  ansible.builtin.stat:
    path: "{{ services_path }}/{{ service_name }}/hooks/pre.yml"
  delegate_to: localhost
  become: false
  register: pre_hook
  tags:
    - services

- name: "{{ service_name }} - Run pre-deploy hook"
  ansible.builtin.include_tasks: "{{ services_path }}/{{ service_name }}/hooks/pre.yml"
  when: pre_hook.stat.exists
  tags:
    - services

- name: "{{ service_name }} - Ensure config directory exists"
  ansible.builtin.file:
    path: "{{ services_base_path }}/{{ service_name }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_group }}"
    mode: "0755"
  tags:
    - services

- name: "{{ service_name }} - Template compose.yml"
  ansible.builtin.template:
    src: "{{ services_path }}/{{ service_name }}/templates/compose.yml.j2"
    dest: "{{ services_base_path }}/{{ service_name }}/compose.yml"
    owner: "{{ docker_user }}"
    group: "{{ docker_group }}"
    mode: "0644"
  register: compose_result
  tags:
    - services

- name: "{{ service_name }} - Check if .env template exists"
  ansible.builtin.stat:
    path: "{{ services_path }}/{{ service_name }}/templates/.env.j2"
  register: env_template
  delegate_to: localhost
  become: false
  tags:
    - services

- name: "{{ service_name }} - Template .env file"
  ansible.builtin.template:
    src: "{{ services_path }}/{{ service_name }}/templates/.env.j2"
    dest: "{{ services_base_path }}/{{ service_name }}/.env"
    owner: "{{ docker_user }}"
    group: "{{ docker_group }}"
    mode: "0600"
  register: env_result
  when: env_template.stat.exists
  tags:
    - services

- name: "{{ service_name }} - Check for extra templates"
  ansible.builtin.find:
    paths: "{{ services_path }}/{{ service_name }}/templates"
    patterns: "*.j2"
    excludes:
      - "compose.yml.j2"
      - ".env.j2"
    recurse: true
  register: extra_templates
  delegate_to: localhost
  become: false
  tags:
    - services

- name: "{{ service_name }} - Check for static files"
  ansible.builtin.find:
    paths: "{{ services_path }}/{{ service_name }}/templates"
    excludes:
      - "*.j2"
    file_type: file
    recurse: true
  register: static_files
  delegate_to: localhost
  become: false
  tags:
    - services

- name: "{{ service_name }} - Ensure extra file subdirectories exist"
  ansible.builtin.file:
    path: "{{ services_base_path }}/{{ service_name }}/{{ item.path | relpath(services_path + '/' + service_name + '/templates') | dirname }}"
    state: directory
    owner: "{{ docker_user }}"
    group: "{{ docker_group }}"
    mode: "0755"
  loop: "{{ extra_templates.files + static_files.files }}"
  when: (item.path | relpath(services_path + '/' + service_name + '/templates') | dirname) != '.'
  tags:
    - services

- name: "{{ service_name }} - Template extra files"
  ansible.builtin.template:
    src: "{{ item.path }}"
    dest: "{{ services_base_path }}/{{ service_name }}/{{ item.path | relpath(services_path + '/' + service_name + '/templates') | regex_replace('\\.j2$', '') }}"
    owner: "{{ docker_user }}"
    group: "{{ docker_group }}"
    mode: "0644"
  loop: "{{ extra_templates.files }}"
  register: extra_result
  tags:
    - services

- name: "{{ service_name }} - Copy static files"
  ansible.builtin.copy:
    src: "{{ item.path }}"
    dest: "{{ services_base_path }}/{{ service_name }}/{{ item.path | relpath(services_path + '/' + service_name + '/templates') }}"
    owner: "{{ docker_user }}"
    group: "{{ docker_group }}"
    mode: "0644"
  loop: "{{ static_files.files }}"
  register: static_result
  tags:
    - services

- name: "{{ service_name }} - Docker compose up"
  community.docker.docker_compose_v2:
    project_src: "{{ services_base_path }}/{{ service_name }}"
    state: present
    pull: "{{ docker_pull_policy }}"
    recreate: "{{ 'always' if (env_result is changed or extra_result is changed or static_result is changed) else 'auto' }}"
  register: compose_up
  tags:
    - services

- name: "{{ service_name }} - Check for post-deploy hook"
  ansible.builtin.stat:
    path: "{{ services_path }}/{{ service_name }}/hooks/post.yml"
  delegate_to: localhost
  become: false
  register: post_hook
  tags:
    - services

- name: "{{ service_name }} - Run post-deploy hook"
  ansible.builtin.include_tasks: "{{ services_path }}/{{ service_name }}/hooks/post.yml"
  when: post_hook.stat.exists
  tags:
    - services
