---
# NixOS transcoder host
# Docker managed via NixOS configuration, not ansible
ansible_python_interpreter: auto
git_group: users
docker_group: users

enabled_services:
  - frigate
  - audiomuse-ai
  - promtail

docker_networks:
  - internal

render_group: "303"
gpu_device: "/dev/dri/renderD128"
libva_driver_name: "iHD"

# Monitoring
monitoring_host_custom_templates:
  - { src: smartctl-collect.sh.j2, dest: host/collect-smartctl.sh }

smartctl_devices:
  - /dev/sda
