domain: "69.net.ar"
internal_domain: "internal"
timezone: "America/Argentina/Buenos_Aires"

nas_ip: "10.0.0.2"
tailscale_routes_network: "10.0.0.0/24"

paths:
  raid: "/mnt/raid"
  media: "/mnt/raid/media"
  downloads: "/mnt/raid/downloads"
  uploads: "/mnt/raid/uploads"
  config: "/mnt/raid/config"
  data: "/media/data"

docker_networks:
  - media
  - local

docker_user: skynet
docker_group: "{{ docker_user }}"

common_packages:
  - curl
  - wget
  - git
  - htop
  - jq
  - rsync
  - vim
  - net-tools
  - dnsutils
  - iotop
  - ncdu
  - tmux

service_ports:
  jellyfin: 8096
  navidrome: 4533
  immich: 2283
  radarr: 7878
  sonarr: 8989
  prowlarr: 9696
  qbittorrent: 8080
  seerr: 5055
  pihole_dns: 53
  pihole_web: 6969

  scrutiny: 8081
  jfa_go: 8056

  lidarr: 8686
  bazarr: 6767
  slskd: 5030
  frigate: 8971
  audiomuse: 8000
  obsidian_livesync: 5984
  homeassistant: 8123
  mosquitto: 1883
  ilias: 8082
  influxdb: 8181
  grafana: 3000
  loki: 3100

# Home Assistant
frigate_hass_integration_version: "v5.14.2"
remote_hass_integration_version: "4.6"
ha_notify_services:
  - notify.mobile_app_nora_moto_g14
  - notify.mobile_app_sm_a528b

# Immich
immich_version: "v2.6.3"

# Jellyfin
jellyfin_version: "10.11.7"

# Promtail: each host pushes to Loki via Caddy's loki.internal route
promtail_loki_url: "https://loki.{{ internal_domain }}/loki/api/v1/push"

# Git repository configuration
github_ssh_key: "{{ vault_github_ssh_key }}"
github_ssh_pubkey: "{{ vault_github_ssh_pubkey }}"
nixos_config_repo: "git@github.com:nacho692/homelab.git"
nixos_config_path: "/home/{{ docker_user }}/homelab"
nixos_config_branch: "master"

# Ansible become password from vault
ansible_become_pass: "{{ vault_ansible_become_pass }}"
