---
- name: Setup NixOS hosts
  hosts: nixos
  gather_facts: false
  become: true
  pre_tasks:
    - name: Bootstrap Python and git on NixOS
      raw: which python3 && which git || nix-env -iA nixos.python3 nixos.git
      changed_when: false
  roles:
    - nixos-rebuild
  post_tasks:
    - name: Remove nix-env python3 and git
      raw: nix-env -e python3 git 2>/dev/null || true
      changed_when: false
  tags:
    - nixos

- name: Setup Deb hosts
  hosts: deb
  become: true
  roles:
    - common

- name: Setup git on all hosts
  hosts: all
  become: true
  roles:
    - git-setup

- name: Deploy NAS
  hosts: nas
  become: true
  roles:
    - docker
    - services
    - nfs-server
  tags:
    - services
