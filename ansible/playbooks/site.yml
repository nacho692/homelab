---
- name: Setup Deb hosts
  hosts: deb
  become: true
  roles:
    - common

- name: Setup git on all hosts
  hosts: all
  become: true
  roles:
    - git-setup
  tags:
    - nixos
    - monitoring

- name: Setup NixOS hosts
  hosts: nixos
  gather_facts: false
  become: true
  pre_tasks:
    - name: Bootstrap Python and git on NixOS
      raw: which python3 && which git || nix-env -iA nixos.python3 nixos.git
      changed_when: false
  roles:
    - nixos-rebuild
  post_tasks:
    - name: Remove nix-env python3 and git
      raw: nix-env -e python3 git 2>/dev/null || true
      changed_when: false
  tags:
    - nixos
    - monitoring

- name: Deploy Transcoder
  hosts: transcoder
  become: true
  pre_tasks:
    - name: Ensure Docker networks exist
      command: docker network create {{ item }}
      loop: "{{ docker_networks }}"
      register: network_result
      changed_when: network_result.rc == 0
      failed_when: network_result.rc != 0 and 'already exists' not in network_result.stderr
  roles:
    - services
    - role: monitoring
      tags: [services, monitoring]
  tags:
    - services

- name: Deploy NAS
  hosts: nas
  become: true
  roles:
    - role: nfs-server
      tags: services
    - role: docker
      tags: services
    - role: services
      tags: services
    - role: monitoring
      tags: [services, monitoring]
